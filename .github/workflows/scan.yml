name: Malware-Scan

# Lädt alle Dateien des Packs und scannt sie mit ClamAV. Bei jedem Build (aus build.yml heraus) nur Dateien, die noch
# nie sauber gescannt wurden, meist also nur neue Jars. Der nächtliche Lauf auf main und ein Start von Hand scannen
# alles mit den aktuellen Signaturen: Wird eine Mod, die wir längst ausliefern, nachträglich als Malware bekannt,
# fällt das spätestens am nächsten Tag auf.
on:
  workflow_call:
    inputs:
      full-scan:
        type: boolean
        default: false
    outputs:
      result:
        description: Ergebnis in einer Zeile, für die Ankündigung im Discord
        value: ${{ jobs.scan.outputs.result }}
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      full-scan:
        description: Alle Dateien scannen, nicht nur neue
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      result: ${{ steps.clamav.outputs.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Speichern übernimmt der Build-Job, der denselben Schlüssel nutzt
      - name: Restore packwiz cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools
            build/cache
          key: packwiz-${{ hashFiles('upstream.json', 'overlay/**/*.pw.toml') }}
          restore-keys: packwiz-

      - name: Assemble pack
        run: python3 scripts/cozytoria.py assemble

      - name: Restore downloaded mods
        id: files-cache
        uses: actions/cache/restore@v4
        with:
          path: build/scan/files
          key: scan-files-${{ hashFiles('upstream.json', 'overlay/**/*.pw.toml', 'remove.txt') }}
          restore-keys: scan-files-

      - name: Download all mods
        id: fetch
        run: python3 scripts/cozytoria.py fetch-mods

      - name: Save downloaded mods
        if: always() && steps.fetch.outcome == 'success' && steps.files-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/scan/files
          key: ${{ steps.files-cache.outputs.cache-primary-key }}

      # Welche Dateien schon sauber waren, merkt sich der Scan hier, so bleibt der Build schnell
      - name: Restore scan results
        uses: actions/cache/restore@v4
        with:
          path: build/scan/clamav.json
          key: clamav-results-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: clamav-results-

      - name: Scan with ClamAV
        id: clamav
        run: >-
          python3 scripts/cozytoria.py scan-clamav
          ${{ (github.event_name == 'schedule' || inputs.full-scan) && '--full' || '' }}

      - name: Save scan results
        if: always() && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/scan/clamav.json
          key: clamav-results-${{ github.run_id }}-${{ github.run_attempt }}
